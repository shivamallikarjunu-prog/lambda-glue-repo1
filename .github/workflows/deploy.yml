name: Deploy AWS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - tst

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set target environment
        id: target
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          else
            TARGET_ENV="dev"
          fi

          case "$TARGET_ENV" in
            dev)
              echo "env=dev" >> "$GITHUB_OUTPUT"
              echo "role=arn:aws:iam::040066346167:role/git_role" >> "$GITHUB_OUTPUT"
              echo "stack=data-platform-stack-dev" >> "$GITHUB_OUTPUT"
              echo "account=040066346167" >> "$GITHUB_OUTPUT"
              ;;
            tst)
              echo "env=tst" >> "$GITHUB_OUTPUT"
              echo "role=arn:aws:iam::039473174687:role/GITAWSrole" >> "$GITHUB_OUTPUT"
              echo "stack=data-platform-stack-tst" >> "$GITHUB_OUTPUT"
              echo "account=039473174687" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          echo "Deploying to $TARGET_ENV environment"

      - name: Checkout repository
        uses: actions/checkout@v4

      # Get and decode the GitHub OIDC token
      - name: Inspect GitHub OIDC token
        shell: bash
        run: |
          set -e

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN=$(curl \
            -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain OIDC token"
            exit 1
          fi

          echo ""
          echo "===== OIDC TOKEN CLAIMS ====="

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            event_name
          }'

          echo ""
          echo "===== END OIDC CLAIMS ====="

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.target.outputs.role }}
          role-session-name: github-actions-${{ steps.target.outputs.env }}-${{ github.run_id }}

      - name: Verify AWS credentials
        run: |
          echo "Testing AWS credentials for ${{ steps.target.outputs.env }} account..."
          aws sts get-caller-identity
          echo "AWS credentials verified successfully for account ${{ steps.target.outputs.account }}"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yaml \
            --stack-name ${{ steps.target.outputs.stack }} \
            --parameter-overrides \
              BucketNamePrefix=data-platform \
              GitHubRepo=shivamallikarjunu-prog/lambda-glue-repo1 \
              GitHubBranch=main \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Upload Glue script
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="data-platform-${ACCOUNT_ID}-${AWS_REGION}"

          aws s3 cp \
            src/glue/partition_data.py \
            "s3://${BUCKET_NAME}/scripts/partition_data.py"

      - name: Create Glue job
        run: |
          STACK_NAME="${{ steps.target.outputs.stack }}"
          GLUE_JOB_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`GlueJobName`].OutputValue' \
            --output text)
          GLUE_JOB_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`GlueJobRoleArn`].OutputValue' \
            --output text)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="data-platform-${ACCOUNT_ID}-${AWS_REGION}"

          if ! aws glue get-job --job-name "$GLUE_JOB_NAME" >/dev/null 2>&1; then
            aws glue create-job \
              --name "$GLUE_JOB_NAME" \
              --role "$GLUE_JOB_ROLE_ARN" \
              --command Name=glueetl,ScriptLocation="s3://${BUCKET_NAME}/scripts/partition_data.py",PythonVersion=3 \
              --glue-version 4.0 \
              --max-retries 0 \
              --number-of-workers 2 \
              --worker-type G.1X \
              --default-arguments '{"--job-bookmark-option":"job-bookmark-disable","--enable-metrics":"true","--input_s3_path":"s3://'"${BUCKET_NAME}"'/incoming/","--output_s3_path":"s3://'"${BUCKET_NAME}"'/processed/"}' \
              --execution-property MaxConcurrentRuns=1
          fi

      - name: Upload sample input
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="data-platform-${ACCOUNT_ID}-${AWS_REGION}"

          mkdir -p tmp

          cat <<'EOF' > tmp/sample.csv
          id,name,city,state,country
          1,Alice,New York,NY,USA
          2,Bob,Chicago,IL,USA
          3,Charlie,Toronto,ON,Canada
          EOF

          aws s3 cp \
            tmp/sample.csv \
            "s3://${BUCKET_NAME}/incoming/sample.csv"