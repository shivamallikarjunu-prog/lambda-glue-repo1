name: Deploy AWS Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: data-platform-stack

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            role-to-assume: arn:aws:iam::040066346167:role/git_role
            stack-name: data-platform-stack-dev
            account-id: 040066346167
          - name: tst
            role-to-assume: arn:aws:iam::039473174687:role/GITAWSrole
            stack-name: data-platform-stack-tst
            account-id: 039473174687

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Get and decode the GitHub OIDC token
      - name: Inspect GitHub OIDC token
        shell: bash
        run: |
          set -e

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN=$(curl \
            -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain OIDC token"
            exit 1
          fi

          echo ""
          echo "===== OIDC TOKEN CLAIMS ====="

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          # Add padding for base64 decoding
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            event_name
          }'

          echo ""
          echo "===== END OIDC CLAIMS ====="

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ matrix.role-to-assume }}
          role-session-name: github-actions-${{ matrix.name }}-${{ github.run_id }}

      - name: Verify AWS credentials
        run: |
          echo "Testing AWS credentials for ${{ matrix.name }} account..."
          aws sts get-caller-identity
          echo "AWS credentials verified successfully for account ${{ matrix.account-id }}"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yaml \
            --stack-name ${{ matrix.stack-name }} \
            --parameter-overrides \
              BucketNamePrefix=data-platform \
              GitHubRepo=shivamallikarjunu-prog/lambda-glue-repo1 \
              GitHubBranch=main \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Upload Glue script and sample input
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="data-platform-${ACCOUNT_ID}-${AWS_REGION}"

          aws s3 cp \
            src/glue/partition_data.py \
            "s3://${BUCKET_NAME}/scripts/partition_data.py"

          mkdir -p tmp

          cat <<'EOF' > tmp/sample.csv
          id,name,city,state,country
          1,Alice,New York,NY,USA
          2,Bob,Chicago,IL,USA
          3,Charlie,Toronto,ON,Canada
          EOF

          aws s3 cp \
            tmp/sample.csv \
            "s3://${BUCKET_NAME}/incoming/sample.csv"