name: Deploy AWS Stack

on:
  push:
    branches:
      - main
      - tst

  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        required: true
        default: tst
        type: choice
        options:
          - dev
          - tst

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 1 - DETERMINE TARGET ENVIRONMENT
      # ============================================================

      - name: Set target environment
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/tst" ]; then
            TARGET_ENV="tst"
          else
            TARGET_ENV="dev"
          fi

          case "$TARGET_ENV" in

            dev)
              echo "env=dev" >> "$GITHUB_OUTPUT"
              echo "role=arn:aws:iam::040066346167:role/git_role" >> "$GITHUB_OUTPUT"
              echo "stack=lambda-glue-dev" >> "$GITHUB_OUTPUT"
              echo "resource-prefix=lambda-glue-dev" >> "$GITHUB_OUTPUT"
              echo "account=040066346167" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;

            tst)
              echo "env=tst" >> "$GITHUB_OUTPUT"
              echo "role=arn:aws:iam::039473174687:role/GITAWSrole" >> "$GITHUB_OUTPUT"
              echo "stack=lambda-glue-tst" >> "$GITHUB_OUTPUT"
              echo "resource-prefix=lambda-glue-tst" >> "$GITHUB_OUTPUT"
              echo "account=039473174687" >> "$GITHUB_OUTPUT"
              echo "branch=tst" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          echo "=========================================="
          echo "Target environment : $TARGET_ENV"
          echo "AWS account        : $(grep '^account=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Branch             : $(grep '^branch=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "=========================================="

      # ============================================================
      # STEP 2 - CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 3 - INSPECT GITHUB OIDC TOKEN
      # ============================================================

      - name: Inspect GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN=$(curl \
            -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain OIDC token"
            exit 1
          fi

          echo ""
          echo "===== OIDC TOKEN CLAIMS ====="

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_owner,
            repository_id,
            repository_owner_id,
            ref,
            event_name
          }'

          echo ""
          echo "===== END OIDC CLAIMS ====="

      # ============================================================
      # STEP 4 - CONFIGURE AWS OIDC CREDENTIALS
      # ============================================================

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.target.outputs.role }}
          role-session-name: github-actions-${{ steps.target.outputs.env }}-${{ github.run_id }}

      # ============================================================
      # STEP 5 - VERIFY AWS ACCOUNT
      # ============================================================

      - name: Verify AWS credentials
        run: |
          set -euo pipefail

          echo "Testing AWS credentials..."

          aws sts get-caller-identity

          echo ""
          echo "Expected AWS account:"
          echo "${{ steps.target.outputs.account }}"

          echo ""
          echo "Actual AWS account:"
          aws sts get-caller-identity \
            --query Account \
            --output text

      # ============================================================
      # STEP 6 - VALIDATE CLOUDFORMATION
      # ============================================================

      - name: Validate CloudFormation template
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation.yaml

      # ============================================================
      # STEP 7 - DEPLOY CLOUDFORMATION
      # ============================================================

      - name: Deploy CloudFormation stack
        run: |
          set -euo pipefail

          echo "Deploying stack:"
          echo "${{ steps.target.outputs.stack }}"

          echo "Deploying branch:"
          echo "${{ steps.target.outputs.branch }}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation.yaml \
            --stack-name "${{ steps.target.outputs.stack }}" \
            --parameter-overrides \
              BucketNamePrefix="${{ steps.target.outputs.resource-prefix }}" \
              GitHubRepo="shivamallikarjunu-prog/lambda-glue-repo1" \
              GitHubBranch="${{ steps.target.outputs.branch }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${{ env.AWS_REGION }}"

      # ============================================================
      # STEP 8 - SHOW STACK OUTPUTS
      # ============================================================

      - name: Show stack outputs
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CloudFormation Outputs"
          echo "=========================================="

          aws cloudformation describe-stacks \
            --stack-name "${{ steps.target.outputs.stack }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs" \
            --output table
